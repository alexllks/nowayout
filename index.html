<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>No Way Out</title>
  <meta name="description" content="A hotel corridor that repeats. Spot what has changed, choose the right door, nine times in a row. A short psychological-horror platformer.">
  <meta name="theme-color" content="#0b0d0f">
  <meta property="og:title" content="No Way Out">
  <meta property="og:description" content="Fourth floor. Lift at one end, stairs at the other. Nine corridors and you may leave.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/images/title.webp">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    body { font-family: Georgia, "Times New Roman", serif; color: #e8e2d0; }
    #game { position: absolute; left: 0; top: 0; display: block; image-rendering: auto; outline: none; }
    noscript { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 2rem; }
    #rotate { display: none; position: absolute; inset: 0; background: #000; color: #9c9484; place-items: center; text-align: center; padding: 2rem; font-size: 1.1rem; }

  </style>
</head>
<body>
  <canvas id="game" width="1280" height="720" tabindex="0" aria-label="No Way Out, a 2D horror game. Keyboard required."></canvas>
  <div id="rotate">No Way Out needs a keyboard and a landscape screen.<br><br>Turn your device, or play on a computer.</div>
  <noscript>No Way Out needs JavaScript to run.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
